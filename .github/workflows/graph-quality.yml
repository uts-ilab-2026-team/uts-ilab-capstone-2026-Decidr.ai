name: Graph prototype quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install graph dependencies
        run: python -m pip install -r requirements-graph.txt

      - name: Check graph formatting
        run: >-
          python -m ruff format --check
          framework/graph_prototype
          decidr/graph_app
          tests/test_graph_prototype.py

      - name: Lint graph files
        run: >-
          python -m ruff check
          framework/graph_prototype
          decidr/graph_app
          tests/test_graph_prototype.py

      - name: Test graph prototype
        run: python -m pytest tests/test_graph_prototype.py -q

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "decidr"
version = "0.0.1"
description = "Project delivery, technical development and assessment evidence for UTS Innovation Lab Capstone Project \u2014 Spring 2026."
authors = [
  { name = "iLab 14-02" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "networkx>=3.3,<4",
    "notebook",
    "numpy",
    "pandas",
    "pydantic>=2.8,<3",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "streamlit>=1.40,<2",
    "tqdm",
    "typer",
]
requires-python = "~=3.11.0"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]


[tool.ruff]
line-length = 99
src = ["decidr"]
include = ["pyproject.toml", "decidr/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["decidr"]
force-sort-within-sections = true
